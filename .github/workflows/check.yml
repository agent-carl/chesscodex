# The same checks as before a commit (tools/check.sh: PHPStan, PHPUnit, the
# esbuild build), on every push. Uses the PHP, Composer and Node that come
# with the runner image, no third-party actions.
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: php -v | head -1 && node -v
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: bash tools/check.sh
      - name: The built files in the commit match their sources
        run: git diff --exit-code --stat -- public vendor
