# Keep the systemd journal across reboots (/etc/systemd/journald.conf.d/60-persistent.conf).
# Raspberry Pi OS keeps it in RAM only (40-rpi-volatile-storage.conf), so the logs
# of PHP-FPM, backups, fail2ban and cloudflared vanished at every reboot, including
# the automatic 04:00 update reboots. Capped at 50 MB to go easy on the SD card.
[Journal]
Storage=persistent
SystemMaxUse=50M
