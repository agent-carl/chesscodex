; Chess Codex overrides (/etc/php/8.4/{fpm,cli}/conf.d/90-chesscodex.ini).
; pi-setup.sh fills in date.timezone from the system clock settings.
expose_php = Off
date.timezone = @TIMEZONE@

; OPcache keeps compiled scripts in RAM. 32 MB is plenty for ~3,000 lines;
; timestamps are re-checked every 2 s, so a deploy shows up without a restart.
opcache.enable = 1
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
