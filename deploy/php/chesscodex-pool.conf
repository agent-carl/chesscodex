; Caissa Codex PHP-FPM pool (/etc/php/8.4/fpm/pool.d/chesscodex.conf).
; Replaces Debian's default "www" pool, which keeps idle workers around.

[chesscodex]
user  = www-data
group = www-data
listen = /run/php/chesscodex-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; "ondemand": workers start with the first request and exit after 30 s idle,
; so PHP costs no RAM while nobody is on the site (1 GB Pi).
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 1M

; Hardening — a hole in the site can't reach the rest of the Pi.
; The code never shells out; it only touches its own folder, fonts (og.php),
; the temp dir (rate limits) and PHP sessions (admin login).
php_admin_value[open_basedir] = /var/www/chesscodex/:/tmp/:/usr/share/fonts/:/var/lib/php/sessions/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
security.limit_extensions = .php
