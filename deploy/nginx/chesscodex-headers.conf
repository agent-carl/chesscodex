# Chess Codex security headers (/etc/nginx/snippets/chesscodex-headers.conf),
# same set as .htaccess sent on OVH. nginx drops inherited add_header lines in
# any block that sets its own, so every such location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
