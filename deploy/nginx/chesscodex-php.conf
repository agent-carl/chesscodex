# Caissa Codex: hand a request to PHP-FPM (/etc/nginx/snippets/chesscodex-php.conf).
include /etc/nginx/snippets/chesscodex-headers.conf;
# The stylesheet preload hint is sent by templates/layout.php with the same
# ?v=<hash> URL the page uses; a static unversioned one made browsers fetch it twice.

try_files $uri =404;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param HTTPS on;          # visitors always arrive over HTTPS (Cloudflare terminates TLS)
fastcgi_param HTTP_PROXY "";     # httpoxy
fastcgi_pass unix:/run/php/chesscodex-fpm.sock;
fastcgi_read_timeout 60s;
