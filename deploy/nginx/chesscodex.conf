# Chess Codex — nginx site on the Raspberry Pi (/etc/nginx/sites-available/chesscodex).
#
# Visitors reach it only through the Cloudflare Tunnel: cloudflared forwards to
# http://127.0.0.1:8081 and Cloudflare terminates HTTPS. Nothing listens on the
# LAN or the internet. The rules mirror what .htaccess gave Apache on OVH.

server {
    listen 127.0.0.1:8081 default_server;
    server_name chesscodex.org www.chesscodex.org;

    root  /var/www/chesscodex;
    index index.php;

    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/chesscodex.access.log combined buffer=32k flush=5m;
    error_log  /var/log/nginx/chesscodex.error.log warn;

    # cloudflared connects from 127.0.0.1; the visitor's address comes in
    # CF-Connecting-IP (always set by Cloudflare, can't be spoofed through it).
    # PHP's rate limits and logs read REMOTE_ADDR.
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    if ($host = www.chesscodex.org) {
        return 301 https://chesscodex.org$request_uri;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml application/wasm;

    include /etc/nginx/snippets/chesscodex-headers.conf;

    # --- Never served: data, code, secrets, tooling (.htaccess "Require all denied").
    location ~ /\.                                                  { deny all; }
    location ~ ^/(db|lib|tools|tests|deploy|_composer_vendor)(/|$)  { deny all; }
    location ~ \.(sql|md|tsv|neon|lock|log)$                        { deny all; }
    location ~ ^/(config\.php|config\.example\.php|composer\.json|VERSION)$ { deny all; }

    # --- PHP: the front controller and the OG image endpoint only.
    location = /index.php { include /etc/nginx/snippets/chesscodex-php.conf; }
    location = /og.php    { include /etc/nginx/snippets/chesscodex-php.conf; }
    # Token-gated maintenance scripts: from the Pi itself only
    # (curl "http://127.0.0.1:8081/prewarm.php?token=…"). Through the tunnel
    # REMOTE_ADDR is the visitor's real IP, so they are refused.
    location ~ ^/(migrate|prewarm)\.php$ {
        allow 127.0.0.1;
        deny  all;
        include /etc/nginx/snippets/chesscodex-php.conf;
    }
    location ~ \.php$ { return 404; }

    # --- Static files. The service worker comes first: it must stay fresh and
    # may control the whole origin (its scope is "/").
    location ~ ^/public/sw(\.min)?\.js$ {
        include /etc/nginx/snippets/chesscodex-headers.conf;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }
    location = /public/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    # Everything else static: cached for 30 days, busted by ?v=<hash> in templates.
    location ~* \.(js|css|wasm|svg|woff2?|png|jpe?g|gif|ico)$ {
        include /etc/nginx/snippets/chesscodex-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        types {
            application/javascript js;
            text/css               css;
            application/wasm       wasm;
            image/svg+xml          svg;
            font/woff2             woff2;
            font/woff              woff;
            image/png              png;
            image/jpeg             jpg jpeg;
            image/gif              gif;
            image/x-icon           ico;
        }
        try_files $uri =404;
    }

    # --- Pretty URLs: a real file, otherwise the router in index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }
}
